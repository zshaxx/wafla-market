<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="WAFLA MARKET - Buy and sell products in Tanzania">

  <title>WAFLA MARKET</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="header">

    <div class="logo">

      <div class="logo-icon">
        🧺
      </div>

      <div class="logo-text">
        <span>WAFLA</span>
        <span>MARKET</span>
      </div>

    </div>


    <div class="header-actions">

      <button class="icon-btn" id="notificationBtn">
        🔔
      </button>

      <button class="cart-btn" id="cartBtn">
        🛒
        <span id="cartCount">0</span>
      </button>

    </div>

  </header>



  <!-- ================= MAIN ================= -->
  <main class="container">


    <!-- LOCATION -->
    <section class="location-section">

      <div class="location-box">

        <span class="location-icon">
          📍
        </span>

        <div>

          <small>YOUR LOCATION</small>

          <strong>
            Mwanza, Tanzania
          </strong>

        </div>

        <span class="arrow">
          ▼
        </span>

      </div>

    </section>



    <!-- SEARCH -->
    <section class="search-section">

      <div class="search-box">

        <span class="search-icon">
          🔍
        </span>

        <input
          type="text"
          id="searchInput"
          placeholder="Search fish, fabrics, produce..."
        >

        <button id="clearSearch">
          ✕
        </button>

      </div>


      <button
        class="filter-btn"
        id="filterBtn"
      >
        ⚙️
      </button>

    </section>



    <!-- FILTERS -->
    <section
      class="filters"
      id="filters"
    >

      <button
        class="category active"
        data-category="all"
      >
        All
      </button>

      <button
        class="category"
        data-category="food"
      >
        Food
      </button>

      <button
        class="category"
        data-category="fashion"
      >
        Fashion
      </button>

      <button
        class="category"
        data-category="electronics"
      >
        Electronics
      </button>

      <button
        class="category"
        data-category="home"
      >
        Home
      </button>

      <button
        class="category"
        data-category="services"
      >
        Services
      </button>

    </section>



    <!-- ================= PRODUCTS HEADER ================= -->

    <section class="products-header">

      <div>

        <h1>
          Popular in Mwanza
        </h1>

        <p id="productNumber">
          Products available
        </p>

      </div>

      <button id="seeAllBtn">
        See all
      </button>

    </section>



    <!-- ================= PRODUCT GRID ================= -->

    <section
      class="product-grid"
      id="productGrid"
    >


      <!-- PRODUCT 1 -->

      <article
        class="product-card"
        data-category="food"
        data-name="Fresh Nile Perch"
      >

        <div class="product-image">

          <img
            src="https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=900&q=85"
            alt="Fresh Nile Perch"
          >

          <button
            class="favorite-btn"
            data-id="1"
          >
            ♡
          </button>

        </div>


        <div class="product-info">

          <h2>
            Fresh Nile Perch
          </h2>

          <div class="price">
            TZS 12,000
            <span>/ kg</span>
          </div>

          <div class="product-bottom">

            <div class="rating">
              ⭐ 4.8
              <span>• 24 sold</span>
            </div>

            <button
              class="add-btn"
              data-id="1"
            >
              +
            </button>

          </div>

        </div>

      </article>

      <article
        class="product-card"
        data-category="fashion"
