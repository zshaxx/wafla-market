<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>WAFLA MARKET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#f5f5f5;display:flex;justify-content:center}
.phone{width:100%;max-width:420px;background:#fff;min-height:100vh;position:relative;padding-bottom:100px;box-shadow:0 0 30px rgba(0,0,0,.1)}
.header{display:flex;justify-content:space-between;align-items:center;padding:18px 16px}
.logo{display:flex;gap:8px;align-items:center}
.logo-icon{width:48px;height:48px;background:#1a1f4d;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px}
.logo-text{font-weight:900;line-height:0.9;color:#1a1f4d;font-size:24px;letter-spacing:-1px}
.top-icons{display:flex;gap:16px;font-size:22px}
.loc{margin:0 16px;background:#fef3e2;border-radius:24px;padding:12px 16px;display:flex;align-items:center;gap:8px;color:#6b4a1b;font-weight:500}
.kanga{height:12px;background:repeating-linear-gradient(90deg,#e67e22 0 18px,#1a1f4d 18px 36px,#f1c40f 36px 54px,#c0392b 54px 72px);margin:10px 0}
.search{margin:0 16px;background:#fef3e2;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:10px}
.search input{border:0;background:transparent;flex:1;outline:none;font-size:15px}
.sec{padding:18px 16px 10px;display:flex;justify-content:space-between;align-items:center}
.sec h2{font-size:18px;font-weight:800;color:#1a1f4d}
.sec span{color:#d35400;font-weight:700;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{background:#fff;border-radius:20px;box-shadow:0 4px 18px rgba(0,0,0,.08);padding:10px;border:1px solid #f0f0f0}
.card img{width:100%;height:130px;object-fit:cover;border-radius:14px}
.card h3{font-size:14px;font-weight:700;margin:8px 0 2px;color:#1a1f4d}
.price{color:#d35400;font-weight:800;font-size:13px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.meta small{font-size:11px;color:#555}
.add{width:28px;height:28px;background:#e67e22;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;border:0}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -5px 20px rgba(0,0,0,.1);padding:6px 0 18px}
.kanga2{height:28px;background:repeating-linear-gradient(90deg,#e67e22,#1a1f4d,#f1c40f,#c0392b,#2ecc71);background-size:120px 28px;opacity:.9}
.nav{display:flex;justify-content:space-around;align-items:center;padding-top:10px}
.nav div{text-align:center;font-size:11px;font-weight:600;color:#888}
.nav .active{color:#e67e22}
.center-btn{width:58px;height:58px;background:radial-gradient(circle,#f1c40f,#e67e22,#1a1f4d);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2);margin-top:-30px}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="logo"><div class="logo-icon">🧺</div><div class="logo-text">WAFLA<br>MARKET</div></div>
    <div class="top-icons"><span>🔔</span><span>🛒<sup style="background:red;color:#fff;border-radius:50%;padding:2px 5px;font-size:10px">2</sup></span></div>
  </div>
  <div class="loc">📍 Mwanza, Tanzania ⌄</div>
  <div class="kanga"></div>
  <div class="search">🔍<input placeholder="Search fish, fabrics, produce..."><span>🎙️</span><span>⚙️</span></div>
  <div class="sec"><h2>Popular in Mwanza</h2><span>See all</span></div>
  <div class="grid" id="grid"></div>
  <div class="bottom"><div class="kanga2"></div><div class="nav"><div class="active">🏠<br>Home</div><div>🧭<br>Explore</div><div class="center-btn">+</div><div>💬<br>Inbox</div><div>👤<br>Me</div></div></div>
</div>
<script>
const products=[
{name:"Fresh Nile Perch",price:"TZS 12,000 / kg",rate:"4.8 • 24 sold",img:"https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=500"},
{name:"Kanga Fabric",price:"TZS 8,500 / piece",rate:"4.9 • 56 sold",img:"https://images.unsplash.com/photo-1520903920243-00d872a2d1c9?w=500"},
{name:"Mangoes",price:"TZS 3,000 / kg",rate:"4.6 • 102 sold",img:"https://images.unsplash.com/photo-1553279768-865429fa0078?w=500"},
{name:"Woven Basket",price:"TZS 15,000 / piece",rate:"4.7 • 18 sold",img:"https://images.unsplash.com/photo-1596161290887-9a2b9d9a8d9c?w=500"}
];
document.getElementById("grid").innerHTML=products.map(p=>`
<div class="card">
<img src="${p.img}">
<h3>${p.name}</h3>
<div class="price">${p.price}</div>
<div class="meta"><small>⭐ ${p.rate}</small><button class="add">+</button></div>
</div>`).join("");
</script>
</body>
</html>
