<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sell - Wafla Market</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .sell-page {
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
    }

    .sell-form {
      background: #fff;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .sell-form h1 {
      margin-bottom: 8px;
    }

    .sell-form > p {
      color: #777;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      box-sizing: border-box;
    }

    .form-group textarea {
      min-height: 130px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .post-listing {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      background: #d97816;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .post-listing:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #d97816;
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .sell-form {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="index.html" style="text-decoration:none;color:inherit;">
      <div class="logo">
        <div class="logo-icon">🧺</div>

        <div class="logo-text">
          <span>WAFLA</span>
          <span>MARKET</span>
        </div>
      </div>
    </a>
  </header>

  <main class="sell-page">

    <a href="index.html" class="back-link">
      ← Back to Market
    </a>

    <form class="sell-form" id="sellForm">

      <h1>Sell on Wafla Market</h1>

      <p>
        Post your product and let buyers contact you.
      </p>

      <div class="form-group">
        <label for="name">Product Name</label>

        <input
          type="text"
          id="name"
          placeholder="Example: iPhone 13"
          required
        >
      </div>

      <div class="form-row">

        <div class="form-group">
          <label for="price">Price (TZS)</label>

          <input
            type="number"
            id="price"
            placeholder="850000"
            min="0"
            required
          >
        </div>

        <div class="form-group">
          <label for="category">Category</label>

          <select id="category" required>
            <option value="">Select category</option>
            <option value="Electronics">Electronics</option>
            <option value="Fashion">Fashion</option>
            <option value="Food">Food</option>
            <option value="Home">Home</option>
            <option value="Services">Services</option>
            <option value="Vehicles">Vehicles</option>
            <option value="Other">Other</option>
          </select>
        </div>

      </div>

      <div class="form-group">

        <label for="location">Location</label>

        <input
          type="text"
          id="location"
          placeholder="Example: Mwanza, Nyamagana"
          required
        >

      </div>

      <div class="form-group">

        <label for="phone">Phone / WhatsApp</label>

        <input
          type="tel"
          id="phone"
          placeholder="07XXXXXXXX"
          required
        >

      </div>

      <div class="form-group">

        <label for="image_url">Image URL</label>

        <input
          type="url"
          id="image_url"
          placeholder="https://example.com/image.jpg"
        >

      </div>

      <div class="form-group">

        <label for="description">Description</label>

        <textarea
          id="description"
          placeholder="Describe your product..."
        ></textarea>

      </div>

      <button
        type="submit"
        class="post-listing"
        id="postButton"
      >
        Post Listing
      </button>

    </form>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://exwdildhebdrweqpdjkb.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_rsV-RqT04ZH-HzbJNpqMfw_5uKsyKUB";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form =
      document.getElementById("sellForm");

    const button =
      document.getElementById("postButton");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      button.disabled = true;
      button.textContent = "Posting...";


      const product = {

        name:
          document.getElementById("name").value.trim(),

        price:
          Number(document.getElementById("price").value),

        category:
          document.getElementById("category").value,

        location:
          document.getElementById("location").value.trim(),

        phone:
          document.getElementById("phone").value.trim(),

        image_url:
          document.getElementById("image_url").value.trim() || null,

        description:
          document.getElementById("description").value.trim() || null

      };


      const { data, error } =
        await supabaseClient
          .from("products")
          .insert([product])
          .select();


      if (error) {

        console.error(error);

        alert(
          "Failed to post product:\n\n" +
          error.message
        );

        button.disabled = false;
        button.textContent = "Post Listing";

        return;
      }


      console.log("Product:", data);

      alert(
        "Product posted successfully! 🎉"
      );


      form.reset();

      button.disabled = false;
      button.textContent = "Post Listing";

    });

  </script>

</body>
          </html>
